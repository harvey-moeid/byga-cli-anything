name = "byga-cli-anything-api"
main = "worker/index.ts"
compatibility_date = "2026-11-22"
workers_dev = true
[vars]
GITHUB_OWNER = "harvey-moeid"
GITHUB_REPO = "byga-cli-anything"
APP_ORIGIN = "https://REPLACE_WITH_PAGES_DOMAIN.pages.dev"
# Lax requires the app and API to share a site (same origin or a custom domain with a route).
# Only use None for a cross-site Pages + workers.dev deployment; see docs/SECURITY.md.
COOKIE_SAMESITE = "Lax"
[[d1_databases]]
binding = "DB"
database_name = "byga-cli-anything"
database_id = "REPLACE_AFTER_CREATING_D1"
migrations_dir = "migrations"
